name: Постеры из TMDB

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Пересобрать все постеры заново (а не только недостающие)"
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1"   # по понедельникам: добрать то, что появилось в TMDB за неделю

permissions:
  contents: write

jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать постеры
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node tools/fetch-posters.mjs data posters.json ${{ inputs.all && '--all' || '' }}
      - name: Сохранить posters.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add posters.json
          git diff --staged --quiet || (git commit -m "Обновить постеры из TMDB" && git push)
